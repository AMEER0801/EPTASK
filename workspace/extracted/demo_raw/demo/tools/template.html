<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>EPtask V7.1: holographic twin of the Trishuli valley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#EAF0FF; --muted:#A7B1DC; --line:rgba(160,178,255,.20);
  --glass:rgba(13,17,50,.74); --glass-hi:rgba(22,27,72,.88);
  --blue:#4C8DFF; --white:#EAF2FF; --red:#FF4D5E; --green:#2EE6A6; --yellow:#FFC93C; --violet:#9B5CFF; --magenta:#FF4FD8;
  --t0:#4C8DFF; --t1:#2EE6A6; --t2:#FFC93C; --t3:#9B5CFF;
  --disp:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --font:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  --fast:150ms; --mid:240ms;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1B1554 0%,#0A0D2C 55%,#060818 100%)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--disp);font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--white);background:rgba(8,11,36,.78);border:1px solid rgba(160,178,255,.26);border-left:2px solid var(--blue);padding:1px 7px;border-radius:3px;will-change:transform}
.lbl.route{border-left-color:var(--violet);color:#D8CCFF}
.lbl.route.v{border-left-color:var(--blue);color:#CFE0FF}
.lbl.hz{background:rgba(255,77,94,.9);border-color:#FF8B97;color:#fff;box-shadow:0 0 14px rgba(255,77,94,.6)}
.lbl.amb{border-left-color:var(--red);box-shadow:0 0 10px rgba(255,255,255,.25)}
header#bar{position:fixed;top:0;left:0;right:0;padding:calc(10px + var(--safe-top)) 16px 10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(rgba(7,9,30,.92) 65%,rgba(7,9,30,0));z-index:20}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto;gap:2px}
.brand .top{display:flex;align-items:center;gap:10px}
.flags{display:inline-flex;gap:3px}
.flags i{width:7px;height:18px;border-radius:2px;display:block;box-shadow:0 0 10px currentColor}
.brand strong{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:.03em}
.brand span{color:var(--muted);font-size:12.5px}
.grp{display:flex;align-items:center;gap:8px}
.grp>label{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--glass);padding:2px;backdrop-filter:blur(10px)}
.seg button,.btn,select{font:inherit;font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink);background:transparent;border:0;border-radius:7px;padding:5px 11px;cursor:pointer;transition:background var(--fast),box-shadow var(--fast),color var(--fast)}
.seg button:hover,.btn:hover{background:rgba(160,178,255,.12)}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,rgba(76,141,255,.55),rgba(155,92,255,.55));box-shadow:0 0 14px rgba(110,120,255,.55),inset 0 0 0 1px rgba(200,210,255,.35)}
.seg button:focus-visible,.btn:focus-visible,select:focus-visible,.step:focus-visible,.dockb:focus-visible,.wx:focus-visible,input[type=range]:focus-visible,.pill:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--glass)}
.btn.primary{background:linear-gradient(90deg,#3E7BFF,#8F55FF);border-color:transparent;padding:6px 16px;box-shadow:0 0 18px rgba(110,110,255,.55)}
.btn.primary:hover{filter:brightness(1.12)}
.btn:active,.seg button:active{transform:translateY(1px)}
select{border:1px solid var(--line);background:var(--glass);padding:5px 8px}
select option{background:#141846;color:var(--ink)}
.pill{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:999px;background:var(--glass);padding:4px 11px;cursor:pointer;color:var(--ink)}
.pill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:7px;vertical-align:1px;box-shadow:0 0 8px var(--yellow)}
.pill.full .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
#narr{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 720px));min-width:340px;background:var(--glass-hi);border:1px solid var(--line);border-radius:12px;padding:12px 16px 10px 18px;z-index:15;box-shadow:0 18px 40px rgba(0,0,0,.45);backdrop-filter:blur(14px)}
#narr::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:linear-gradient(var(--blue),var(--violet),var(--magenta));box-shadow:0 0 12px rgba(155,92,255,.8)}
#narr .nh{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
#narr h1{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:.02em;margin:0}
#narr p{margin:6px 0 0;max-width:70ch}
#narr .foot{color:var(--muted);font-size:12.5px}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--line)}
.tag.rec{color:var(--green);border-color:rgba(46,230,166,.55);box-shadow:0 0 10px rgba(46,230,166,.25)}
.tag.ill{color:#FF9AA4;border-color:rgba(255,77,94,.6);box-shadow:0 0 10px rgba(255,77,94,.25)}
.win{position:fixed;--hue:var(--blue);background:var(--glass);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 26px -10px var(--hue);z-index:10;display:flex;flex-direction:column;max-height:calc(100vh - 220px);backdrop-filter:blur(14px) saturate(140%);transition:box-shadow var(--mid)}
.win::before{content:'';position:absolute;left:12px;right:12px;top:-1px;height:2px;border-radius:2px;background:var(--hue);box-shadow:0 0 14px var(--hue)}
.win.flash{box-shadow:0 0 0 1px var(--hue),0 18px 44px rgba(0,0,0,.5),0 0 34px -4px var(--hue)}
.wt{display:flex;align-items:center;gap:8px;padding:8px 8px 7px 11px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.wt:active{cursor:grabbing}
.wt h2{font-family:var(--disp);font-size:13.5px;font-weight:600;letter-spacing:.02em;margin:0;flex:1}
.wtag{font-family:var(--disp);font-size:11px;font-weight:700;padding:1px 6px;border:1px solid var(--hue);color:var(--hue);border-radius:4px;text-shadow:0 0 8px var(--hue)}
.wx{border:0;background:transparent;font-size:17px;line-height:1;padding:2px 7px;border-radius:5px;cursor:pointer;color:var(--muted)}
.wx:hover{background:rgba(160,178,255,.14);color:var(--ink)}
.wb{padding:9px 12px 11px;overflow:auto;font-size:12.8px}
.wb p{margin:0 0 6px}
.wb b{color:#fff}
.muted{color:var(--muted)}
.small{font-size:11.8px}
table.t{width:100%;border-collapse:collapse}
table.t td,table.t th{padding:3px 4px;text-align:left;vertical-align:middle}
table.t th{font-weight:500;color:var(--muted);font-size:11.5px}
table.t tr+tr td{border-top:1px solid rgba(160,178,255,.10)}
.stack{display:flex;height:9px;border-radius:2px;overflow:hidden;width:120px;background:rgba(255,255,255,.07)}
.stack i{display:block;height:100%;opacity:.38}
.stack i.on{opacity:1;box-shadow:0 0 8px currentColor}
.b0{background:var(--t0);color:var(--t0)}.b1{background:var(--t1);color:var(--t1)}.b2{background:var(--t2);color:var(--t2)}.b3{background:var(--t3);color:var(--t3)}
.keys{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 0}
.keys span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.keys i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hbar{height:12px;border-radius:2px;background:var(--t0);opacity:.45}
.hbar.on{opacity:1;box-shadow:0 0 10px var(--t0)}
.hbar.bad{background:repeating-linear-gradient(45deg,rgba(160,178,255,.25),rgba(160,178,255,.25) 4px,rgba(160,178,255,.06) 4px,rgba(160,178,255,.06) 8px);opacity:1}
.ladder{display:grid;grid-template-columns:28px 1fr;gap:1px 8px;margin:4px 0 8px}
.ladder .lv{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ladder .row{height:15px;display:flex;align-items:center;gap:4px;border-radius:3px;padding:0 4px;background:rgba(255,255,255,.03)}
.ladder .row.res{background:rgba(255,201,60,.14);box-shadow:inset 0 0 0 1px rgba(255,201,60,.35)}
.ladder .row .note{font-size:10.5px;color:var(--yellow);margin-left:auto}
.pip{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.pip.p{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.lights{display:flex;gap:6px;margin:4px 0 8px}
.light{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#06221a;background:var(--green);box-shadow:0 0 12px rgba(46,230,166,.75)}
.light.off{background:#3a2230;color:#c9a1aa;box-shadow:inset 0 0 0 1px rgba(255,77,94,.55)}
.chip{font-size:11px;border-radius:999px;padding:1px 7px;border:1px solid var(--line);white-space:nowrap}
.chip.t3{color:#FF9AA4;border-color:rgba(255,77,94,.6);box-shadow:0 0 8px rgba(255,77,94,.35)}
.chip.t2{color:var(--yellow);border-color:rgba(255,201,60,.55)}
.chip.t1{color:var(--muted)}
.ok{color:var(--green);font-weight:600}.bad{color:#FF7A86;font-weight:600}
.score{display:inline-block;height:7px;background:linear-gradient(90deg,var(--magenta),var(--red));border-radius:2px;vertical-align:middle;box-shadow:0 0 6px rgba(255,79,216,.6)}
.cellcv{width:100%;height:200px;display:block;border-radius:8px;background:#0B0F33}
svg.spark{width:100%;height:46px;display:block}
footer#journey{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(10px + var(--safe-bottom));background:linear-gradient(rgba(7,9,30,0),rgba(7,9,30,.94) 30%);z-index:20}
#steps{list-style:none;margin:0;padding:0;display:flex;gap:5px;align-items:stretch}
#steps li{flex:1;min-width:0}
.step{width:100%;text-align:left;font:inherit;font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.02em;color:var(--muted);background:rgba(13,17,50,.7);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;display:flex;gap:7px;align-items:center;transition:background var(--fast),color var(--fast),box-shadow var(--fast)}
.step .n{font-size:11px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;flex:none}
.step .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step:hover{color:var(--ink);background:rgba(22,27,72,.9)}
.step.done{color:#CFE0FF}
.step.done .n{background:rgba(76,141,255,.35);border-color:var(--blue)}
.step[aria-current="step"]{color:#fff;background:linear-gradient(90deg,rgba(62,123,255,.65),rgba(143,85,255,.65));border-color:rgba(200,210,255,.4);box-shadow:0 0 18px rgba(110,110,255,.55)}
.row2{display:flex;align-items:center;gap:12px;margin-top:7px}
.row2 input[type=range]{flex:1;accent-color:var(--violet)}
#clock{font-family:var(--disp);font-size:12.5px;min-width:200px;color:#CFE0FF}
#dock{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dockb{font:inherit;font-family:var(--disp);font-weight:700;font-size:11px;padding:3px 7px;border-radius:5px;border:1px solid var(--line);background:rgba(13,17,50,.7);color:var(--muted);cursor:pointer}
.dockb[aria-pressed="true"]{border-color:var(--hue);color:var(--hue);box-shadow:0 0 10px -2px var(--hue)}
#nogl{position:fixed;inset:0;display:grid;place-items:center;z-index:5;padding:20px;text-align:center;color:var(--muted)}
.fatal{position:fixed;inset:30% 10% auto;background:#1a1440;border:1px solid var(--red);padding:16px;border-radius:8px;z-index:99;color:var(--ink)}
.logbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.logbar .seg button,.logbar .btn{font-size:11.5px;padding:3px 8px}
.logtbl{max-height:300px;overflow:auto;border-top:1px solid var(--line)}
.lv{font-size:10.5px;font-weight:600;border-radius:4px;padding:0 5px;border:1px solid var(--line)}
.lv.info{color:var(--green)}.lv.warn{color:var(--yellow);border-color:rgba(255,201,60,.5)}.lv.error{color:#FF7A86;border-color:rgba(255,77,94,.6)}.lv.debug{color:var(--muted)}
.lbl.pol{border-left-color:#4C8DFF}.lbl.fire{border-left-color:#FF3B3B}.lbl.army{border-left-color:#9DB05C}
#hud{position:fixed;left:50%;transform:translateX(-50%);top:112px;z-index:30;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;background:rgba(8,11,36,.88);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:#CFE0FF;white-space:pre;pointer-events:none}
@media (max-width:1180px){#narr{width:min(540px,calc(100vw - 32px));bottom:118px}}
@media (max-width:960px){
  #wins{position:fixed;left:0;right:0;bottom:118px;max-height:42vh;overflow:auto;z-index:12;padding:0 8px}
  .win{position:static!important;width:auto!important;max-height:none;margin:10px 0}
  .wt{cursor:default}
  #narr{position:fixed;bottom:calc(118px + 42vh);left:8px;right:8px;transform:none;width:auto;min-width:0}
  .step .s{display:none}
  #clock{min-width:0}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="demo-data" type="application/json">__DATA__</script>
<script>
(function () {
'use strict';
const ERR = [];
const API = { ready: false, errors: ERR };
window.__demo = API;
/* ------------------------------------------------------------ log (observability)
   Entry schema: {seq, ts: ms since load, level: debug|info|warn|error,
   cat: boot|data|scenario|step|sim|render|perf|ui|test|js, msg, ctx: {hz, mode, step, t}, data}.
   Open it from the dock (Log): filter, copy, download, run the self-test.
   ?debug=1 adds a HUD and mirrors debug entries to the console; errors always go to console.error. */
const LOG = []; let LOG_SEQ = 0; const T_LOAD = performance.now();
const DEBUG = /[?&]debug=1/.test(location.search), LEGACY = /[?&]legacy=1/.test(location.search), SELFTEST = /[?&]selftest=1/.test(location.search);
function ctxNow() { try { return { hz: state.hazard, mode: state.mode, step: state.step, t: Math.round(state.t) }; } catch (e) { return null; } }
function log(level, cat, msg, data) {
  const e = { seq: ++LOG_SEQ, ts: +(performance.now() - T_LOAD).toFixed(1), level, cat, msg, ctx: ctxNow(), data: data === undefined ? null : data };
  LOG.push(e); if (LOG.length > 4000) LOG.shift();
  if (level === 'error') { console.error('[eptask:' + cat + '] ' + msg, data || ''); try { openWin('log', false); } catch (x) { /* windows not built yet */ } }
  else if (level !== 'debug' || DEBUG) console.log('[eptask:' + level + ':' + cat + '] ' + msg, data || '');
  return e;
}
API.log = LOG;
window.addEventListener('error', e => { ERR.push(String(e.message || e)); log('error', 'js', String(e.message || e), { src: e.filename, line: e.lineno, col: e.colno, stack: e.error && e.error.stack ? String(e.error.stack).slice(0, 600) : null }); });
window.addEventListener('unhandledrejection', e => { ERR.push('unhandled rejection: ' + e.reason); log('error', 'js', 'unhandled promise rejection', { reason: String(e.reason) }); });
let D;
try { D = JSON.parse(document.getElementById('demo-data').textContent); }
catch (e) { document.body.insertAdjacentHTML('beforeend', '<p class="fatal">The recorded run inside this page could not be read. Regenerate the page with tools/make_traces.py and build.py.</p>'); throw e; }
if (typeof THREE === 'undefined') { document.body.insertAdjacentHTML('beforeend', '<p class="fatal">The 3D library did not load (no internet?). Open the offline copy, index.html, which ships with its own scripts.</p>'); return; }

/* ------------------------------------------------------------ helpers */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX = !/[?&]fx=0/.test(location.search);   // ?fx=0 turns bloom off (slow GPUs, tests)
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);
const META = D.meta, RES = D.results, GR = D.graph, CELL = D.cell;
const HZ = ['earthquake', 'landslide', 'flood'];
const MODES = META.modes;
const MODE_LABEL = { 'NONE': 'None', 'V2V': 'Vehicle-to-vehicle relay', 'RSU': 'Roadside units only', 'V2V+RSU': 'Relay and roadside units' };
const TGT = ['Roadside unit', 'Nearby vehicle', 'On board', 'Cloud'];
const TIER = ['', 'Minor', 'Delayed', 'Immediate'];
// neon prayer-flag palette: blue, white, red, green, yellow (+ violet, magenta)
const C = { blue: 0x4C8DFF, white: 0xEAF2FF, red: 0xFF4D5E, green: 0x2EE6A6, yellow: 0xFFC93C, violet: 0x9B5CFF, magenta: 0xFF4FD8,
  veh: 0x8197E0, stuck: 0xFF6B78, dead: 0x3a2230, roadV: 0x5A9BFF, roadH: 0xA67CFF, mast: 0x2a3160 };
const fmtMin = m => (m == null || !isFinite(m)) ? 'n/a' : (Math.abs(m) < 0.05 ? '0' : m.toFixed(m < 10 ? 1 : 0)) + ' min';
function fmtClock(t) {
  const s = Math.round(Math.abs(t)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  const str = (h ? h + ' h ' : '') + m + ' min';
  if (t < 0) return str + ' before the hazard';
  if (t < 60) return 'the moment of the hazard';
  return str + ' after the hazard';
}
function ci(x, d, unit) {
  if (!x || x[0] == null) return 'n/a';
  const u = unit || '';
  if (!x[2] || x[2] < 2 || x[1] == null) return x[0].toFixed(d) + u + ' (n=' + (x[2] || 1) + ')';
  return x[0].toFixed(d) + ' ± ' + x[1].toFixed(d) + u + ' (n=' + x[2] + ')';
}

HZ.forEach(h => { const b = document.createElement('button'); b.type = 'button'; b.dataset.h = h; b.textContent = META.hazards[h].label; b.addEventListener('click', () => setScenario(h, state.mode)); hs.appendChild(b); });
MODES.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = MODE_LABEL[m]; $('modeSel').appendChild(o); });
$('modeSel').addEventListener('change', e => setScenario(state.hazard, e.target.value));
const ss = $('speedSeg');
[1, 2, 4, 8].forEach(v => { const b = document.createElement('button'); b.type = 'button'; b.textContent = v + '×'; b.setAttribute('aria-pressed', String(v === 1)); b.setAttribute('aria-label', 'Speed ' + v + ' times'); b.addEventListener('click', () => { state.speed = v; ss.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }); ss.appendChild(b); });
function setPlaying(p) { state.playing = p; $('playBtn').textContent = p ? 'Pause' : (state.t >= state.tr.tEnd - 1 ? 'Replay' : 'Play the story'); }
$('playBtn').addEventListener('click', () => { if (!state.playing && state.t >= state.tr.tEnd - 1) goStep(0); setPlaying(!state.playing); });
$('viewBtn').addEventListener('click', () => goView(viewFor(state.step)));
$('scrub').addEventListener('input', e => {
  const tr = state.tr; state.t = tr.tStart + e.target.value / 1000 * (tr.tEnd - tr.tStart);
  let s = 0; state.plan.forEach((pt, i) => { if (state.t >= pt) s = i; });
  if (s !== state.step) { state.step = s; showNarration(); }
  $('clock').textContent = fmtClock(state.t);
});
const stepsEl = $('steps');
STEPS.forEach((s, i) => { const li = document.createElement('li'); const b = document.createElement('button'); b.className = 'step'; b.type = 'button'; b.innerHTML = `<span class="n">${i + 1}</span><span class="s">${esc(s.name)}</span>`; b.setAttribute('aria-label', `Step ${i + 1}: ${s.name}`); b.addEventListener('click', () => goStep(i)); li.appendChild(b); stepsEl.appendChild(li); });
const pill = $('pill');
pill.innerHTML = `<span class="dot"></span>Run ${esc(META.run_id)}, ${META.mode === 'FULL' ? 'full run' : 'QUICK smoke test'}`;
if (META.mode === 'FULL') pill.classList.add('full');
pill.addEventListener('click', () => openWin('run', false));
addEventListener('keydown', e => {
  if (e.target.closest('select,input,textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); $('playBtn').click(); }
  else if (e.key === 'ArrowRight') goStep(state.step + 1);
  else if (e.key === 'ArrowLeft') goStep(state.step - 1);
  else if (/^[1-8]$/.test(e.key)) goStep(+e.key - 1);
});
function resize() {
  if (GL_OK) {
    renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    if (composer) { composer.setSize(innerWidth, innerHeight); if (bloom) bloom.setSize(innerWidth, innerHeight); }
  }
  layout();
}
addEventListener('resize', resize);

/* ------------------------------------------------------------ loop */
let last = performance.now();
function advance(dt, now) {
  if (state.playing) {
    const nextT = state.step + 1 < state.plan.length ? state.plan[state.step + 1] : Infinity;
    let nt = state.t + dt * 60 * state.speed;
    if (nt >= nextT) { if (now >= state.dwellUntil) { goStep(state.step + 1, {}); nt = state.t; } else nt = nextT - 0.01; }
    state.t = Math.min(nt, state.tr.tEnd);
    if (state.t >= state.tr.tEnd) setPlaying(false);
    syncScrub();
  }
  state.cellAcc += dt * 4 * state.speed;
  while (state.cellAcc >= 1) { state.cellAcc -= 1; state.cellTick = (state.cellTick + 1) % CELL.ticks.length; }
}
function renderAll(now) {
  const time = now / 1000;
  stepCam(now);
  if (GL_OK) {
    renderer.info.reset();
    updateStage(state.t, time);
    applyCam(stage.shake || 0);
    if (composer) composer.render(); else renderer.render(scene, camera);
    updateLabels();
  }
  renderCell(state.cellAcc);
  renderWindows(false);
}
const PERF = { frames: 0, t0: performance.now(), fps: 0, low: 0, warned: false };
const SEEN = new Set();
const HUD = DEBUG ? (() => { const d = document.createElement('div'); d.id = 'hud'; document.body.appendChild(d); return d; })() : null;
function hudText() {
  const ri = GL_OK ? renderer.info.render : { calls: 0, triangles: 0 };
  return `fps        ${PERF.fps.toFixed(0)}\ndraw calls ${ri.calls}\ntriangles  ${ri.triangles}\ncivilians  ${stage.vehN}\nemergency  ${stage.fleetPos.length} on the road\nbloom      ${!!composer}\nlegacy     ${LEGACY}\nerrors     ${ERR.length}`;
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  try { advance(dt, now); renderAll(now); }
  catch (e) { const m = String(e && e.message || e); ERR.push(String(e && e.stack || e)); if (!SEEN.has(m)) { SEEN.add(m); log('error', 'js', 'frame loop error: ' + m, { stack: String(e && e.stack || '').slice(0, 600) }); } }
  PERF.frames++;
  if (now - PERF.t0 >= 1000) {
    PERF.fps = PERF.frames * 1000 / (now - PERF.t0); PERF.frames = 0; PERF.t0 = now;
    PERF.low = PERF.fps < 20 ? PERF.low + 1 : 0;
    if (PERF.low >= 3 && !PERF.warned && document.visibilityState === 'visible') { PERF.warned = true; log('warn', 'perf', 'low frame rate: add ?fx=0 to the address to turn the glow off', { fps: +PERF.fps.toFixed(1), bloom: !!composer, calls: GL_OK ? renderer.info.render.calls : null, triangles: GL_OK ? renderer.info.render.triangles : null }); }
    if (HUD) HUD.textContent = hudText();
  }
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------ audit + self-test */
function projLen(xw, zw, y, len) {
  const a = new THREE.Vector3(xw - len / 2, y, zw).project(camera), b = new THREE.Vector3(xw + len / 2, y, zw).project(camera);
  if (a.z > 1 || b.z > 1 || Math.abs(a.x) > 1 || Math.abs(a.y) > 1) return null;
  return Math.hypot((a.x - b.x) * innerWidth / 2, (a.y - b.y) * innerHeight / 2);
}
function audit() {   // what SHOULD be on screen (from the trace) vs what IS drawn, after the last render
  const tr = state.tr, t = state.t, r = { t: Math.round(t), expected: 0, rendered: stage.vehN, below: 0, nan: 0, fleetExpected: 0, fleetVisible: 0, fleetBelow: 0, medianPx: null };
  if (!GL_OK) return r;
  const tv = Math.min(t, tr.tLastFrame), fi = (tv - tr.tStart) / tr.frame_dt, ff = Math.floor(fi);
  for (const k of tr.tracks) if (!k.amb && fi >= k.f0 && ff <= k.last) r.expected++;
  const px = [];
  for (const p of stage.vehPos) {
    if (!isFinite(p[0] + p[1] + p[2] + p[3])) { r.nan++; continue; }
    if (p[2] < surfaceY(p[0], p[1]) - 0.05) r.below++;
    if (px.length < 80) { const L = projLen(p[0], p[1], p[2], p[3]); if (L != null) px.push(L); }
  }
  if (px.length) { px.sort((x, y) => x - y); r.medianPx = +px[px.length >> 1].toFixed(1); }
  const A = ambAt(tr, t); if (A && !A.s[9]) r.fleetExpected++;
  for (const F of stage.fleet) { const S = trackAt(F.f.track, t); if (S && !(S.f & 64)) r.fleetExpected++; }
  for (const q of stage.fleetPos) { if (!isFinite(q[1] + q[2] + q[3])) continue; r.fleetVisible++; if (q[3] < surfaceY(q[1], q[2]) - 0.05) r.fleetBelow++; }
  return r;
}
function selfTest() {
  const T0s = performance.now(), out = { states: 0, pass: 0, fails: [], jsErrors: 0, legacy: LEGACY, ms: 0 };
  const save = { hz: state.hazard, mode: state.mode, step: state.step, t: state.t, r: cam.r };
  const e0 = ERR.length; setPlaying(false);
  log('info', 'test', 'self-test started', { hazards: HZ.length, modes: MODES.length, legacy: LEGACY });
  const check = (label, extra) => {
    renderAll(performance.now());
    const a = audit(), px = GL_OK ? API.pixelStats() : null, bad = [];
    if (a.rendered !== a.expected) bad.push(`civilian vehicles drawn ${a.rendered} of ${a.expected} recorded`);
    if (a.below) bad.push(`${a.below} vehicles under the terrain`);
    if (a.nan) bad.push(`${a.nan} vehicles with invalid positions`);
    if (a.fleetVisible !== a.fleetExpected) bad.push(`emergency vehicles drawn ${a.fleetVisible} of ${a.fleetExpected} on the road`);
    if (a.fleetBelow) bad.push(`${a.fleetBelow} emergency vehicles under the terrain`);
    if (px && px.std < 6) bad.push('blank or flat frame');
    if (extra) bad.push(...extra(a));
    out.states++;
    if (bad.length) { out.fails.push({ state: label, problems: bad, audit: a }); log('warn', 'test', 'FAIL ' + label + ': ' + bad.join('; '), a); } else out.pass++;
  };
  for (const h of HZ) for (const m of MODES) {
    setScenario(h, m);
    const times = state.plan.concat([state.tr.tLastFrame, state.tr.tEnd]);
    times.forEach((tt, i) => { goStep(Math.min(i, STEPS.length - 1), { instant: true }); state.t = tt; check(`${h} / ${m} / ${i < 8 ? 'step ' + (i + 1) : i === 8 ? 'last recorded minute' : 'end of timeline'}`); });
  }
  setScenario('landslide', 'V2V+RSU'); goStep(5, { instant: true }); cam.r = 1400;
  check('zoom fully out', a => a.medianPx != null && a.medianPx < 3 ? [`vehicles only ${a.medianPx}px long`] : []);
  goStep(1, { instant: true }); state.t = 30; cam.r = 18; check('zoom fully in at the blockage');
  out.jsErrors = ERR.length - e0;
  if (out.jsErrors) out.fails.push({ state: 'whole run', problems: [`${out.jsErrors} script errors`] });
  out.ms = Math.round(performance.now() - T0s);
  setScenario(save.hz, save.mode); goStep(save.step, { instant: true }); state.t = save.t; cam.r = save.r;
  log(out.fails.length ? 'warn' : 'info', 'test', `self-test: ${out.pass} of ${out.states} checks passed` + (out.fails.length ? `, ${out.fails.length} failed` : ''), { fails: out.fails.length, ms: out.ms, legacy: LEGACY });
  API.selftest = out; openWin('log', false); WINS.log._h = null; renderWindows(true);
  return out;
}
/* ------------------------------------------------------------ boot */
state.tr = prep(D.corridor[state.hazard + '|' + state.mode]); state.plan = planFor(state.tr);
buildTraceScene(state.tr);
document.querySelectorAll('#hazardSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.h === state.hazard)));
$('modeSel').value = state.mode;
resize();
if (GL_OK) { const v = viewFor(0); goView({ t: v.t, r: v.r * 1.6, th: v.th - 0.5, ph: 0.6 }, true); }
goStep(0);
requestAnimationFrame(frame);
Object.assign(API, {
  goStep: i => goStep(i, { instant: true }), setScenario, setTime: t => { state.t = t; syncScrub(); }, setCell: k => { state.cellTick = k; },
  open: id => openWin(id, false), render: () => { cam.tw = null; renderAll(performance.now()); },
  pixelStats: () => {
    if (!GL_OK) return null; renderAll(performance.now());
    const c2 = document.createElement('canvas'); c2.width = 160; c2.height = 100; const x = c2.getContext('2d'); x.drawImage(canvas, 0, 0, 160, 100);
    const d = x.getImageData(0, 0, 160, 100).data; let s = 0, s2 = 0; for (let i = 0; i < d.length; i += 4) { const v = (d[i] + d[i + 1] + d[i + 2]) / 3; s += v; s2 += v * v; }
    const n = d.length / 4, m = s / n; return { mean: m, std: Math.sqrt(Math.max(0, s2 / n - m * m)) };
  },
  info: () => ({ hazard: state.hazard, mode: state.mode, step: state.step, t: state.t, nVeh: API.nVeh, emergencyOnRoad: stage.fleetPos.length, gl: GL_OK, bloom: !!composer, legacy: LEGACY, cell: state.cellTick, open: Object.keys(WINS).filter(k => WINS[k].open) }),
  audit, selfTest, logText,
});
API.ready = true;
log('info', 'boot', 'demo ready', { ms: Math.round(performance.now() - T_LOAD), webgl: GL_OK, bloom: !!composer, legacy: LEGACY, traces: Object.keys(D.corridor).length, cellTicks: CELL.ticks.length, run: META.run_id, mode: META.mode });
if (LEGACY) log('warn', 'boot', 'legacy mode: the pre-fix vehicle placement is active (before/after testing only)');
if (SELFTEST) { const go = () => setTimeout(selfTest, 300); if (document.readyState === 'complete') go(); else addEventListener('load', go); }   // never block the page's own load
})();
</script>
</body>
